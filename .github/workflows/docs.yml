name: Docs

on:
  push:
    branches: docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - run: |
        rustup default 1.97
        RUSTDOCFLAGS="--document-private-items --default-theme=ayu --deny warnings" cargo doc
        cp docs/* target/doc
    - uses: actions/upload-pages-artifact@v5
      with:
        path: 'target/doc'
    - uses: actions/deploy-pages@v5
      id: deployment
